name: Update consensus rankings

on:
  schedule:
    # Every 6 hours during the day, plus 8am ET daily (12:00 UTC) so
    # Sunday morning always has fresh ranks before kickoff.
    - cron: "0 0,6,12,18 * * *"
    # Tuesday 7pm ET (23:00 UTC): fresh weekly ranks the evening waiver
    # claims are due, with Monday night results and Tuesday practice
    # reports baked in.
    - cron: "0 23 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FantasyPros consensus rankings
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python scripts/fetch_rankings.py

      - name: Fetch Sleeper snapshot
        run: python scripts/fetch_snapshot.py

      - name: Fetch Yahoo league
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python scripts/fetch_yahoo.py

      - name: Commit updated data
        run: |
          git config user.name "rankings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rankings.json data/snapshot.json
          git add data/yahoo.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update rankings and snapshot"
            git push
          fi
